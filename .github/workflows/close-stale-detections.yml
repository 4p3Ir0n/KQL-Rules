name: Close stale detection PRs

# Housekeeping: auto-close un-harvested `AutoGenerated/` proposal PRs once they
# age out, and delete their branches, so the daily drafts don't pile up.
#
# Scope is deliberately narrow — it ONLY touches PRs whose head branch starts
# with `auto/detections-` (the branches the refresh workflow creates). Curated
# PRs, feature branches, etc. are never affected.
#
# Escape hatch: add the `keep` label to any auto-proposed PR to exempt it from
# auto-close (e.g. while you're still harvesting detections from it).

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily, after the 06:00 generation run
  workflow_dispatch:
    inputs:
      stale_days:
        description: "Close auto-proposed PRs older than this many days"
        required: false
        default: "7"

permissions:
  contents: write        # delete branches
  pull-requests: write   # close PRs

jobs:
  close-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Close aged-out auto-proposed PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          STALE_DAYS: ${{ github.event.inputs.stale_days || '7' }}
        run: |
          set -euo pipefail
          max_age=$(( STALE_DAYS * 86400 ))
          echo "Closing auto/detections-* PRs older than ${STALE_DAYS} day(s)."

          gh pr list --repo "$REPO" --state open --limit 200 \
            --json number,createdAt,headRefName,labels > prs.json

          numbers=$(jq -r --argjson maxage "$max_age" '
            .[]
            | select(.headRefName | startswith("auto/detections-"))
            | select([.labels[].name] | index("keep") | not)
            | select((now - (.createdAt | fromdateiso8601)) > $maxage)
            | .number' prs.json)

          if [ -z "$numbers" ]; then
            echo "Nothing to close."
            exit 0
          fi

          for n in $numbers; do
            echo "Closing PR #$n"
            gh pr close "$n" --repo "$REPO" --delete-branch \
              --comment "Auto-closing this un-harvested proposal after ${STALE_DAYS} days to keep the queue tidy. The detections were never merged into the curated tactic files. If you still want them, reopen the PR or re-run the refresh workflow. Add the \`keep\` label to exempt a PR from auto-close."
          done
