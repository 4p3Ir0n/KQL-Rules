name: Refresh KQL detections

# Daily pipeline: pull fresh threat intel, draft KQL with Claude, validate
# statically, and open a PR with the proposals for human review.

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch: {}    # allow manual runs from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Run detection-refresh pipeline
        id: pipeline
        working-directory: automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ABUSE_CH_AUTH_KEY: ${{ secrets.ABUSE_CH_AUTH_KEY }}   # optional: enables abuse.ch ThreatFox
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}             # raises SigmaHQ GitHub API rate limit
        run: python run.py

      - name: Open pull request
        if: steps.pipeline.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/detections-${{ steps.pipeline.outputs.date }}
          title: "Auto-proposed KQL detections (${{ steps.pipeline.outputs.date }})"
          commit-message: "chore: add ${{ steps.pipeline.outputs.count }} auto-proposed detection(s)"
          body: |
            Machine-drafted KQL detections from the last few days of threat intel
            (CISA KEV), mapped to MITRE ATT&CK tactics and passed through static
            KQL validation (syntax + known Advanced Hunting schema).

            **Not run against a live tenant.** Review, tune, and test before
            merging any of these into the curated tactic files.
          labels: automated, detections, needs-review
          add-paths: |
            AutoGenerated/**
