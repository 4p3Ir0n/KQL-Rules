# Configuration for the KQL detection-refresh pipeline.

# How many days of threat intel to pull on each run.
lookback_days: 3

# Claude model used to draft/map detections. Override per the claude-api guidance.
model: claude-opus-5

# Max new threats to turn into detections per run (keeps PRs reviewable and cost bounded).
max_threats_per_run: 8

# Threat-intel sources. Only free / no-auth feeds are enabled by default.
sources:
  cisa_kev:
    enabled: true
    url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json

# MITRE ATT&CK tactic -> repo folder that holds that tactic's KQL file.
# The generator maps each threat to one of these tactics.
tactic_dirs:
  InitialAccess: InitialAccess
  Execution: Execution
  Persistence: Persistence
  PrivilegeEscalation: PrivilegeEscalation
  DefenseEvasion: DefenseEvasion
  CredentialAccess: CredentialAccess
  Discovery: Discovery
  LateralMovement: LateralMovement
  Collection: Collection
  CommandAndControl: CommandAndControl
  Exfiltration: Exfiltration
  Impact: Impact

# Where auto-proposed detections are written (never touches the hand-curated files).
output_dir: AutoGenerated
